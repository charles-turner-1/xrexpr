[package]
name = "xrexprs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_xrexprs"       # Module name - needs to match what we have in pyproject.toml and also cargo.toml
crate-type = ["cdylib"]

[dependencies]
# abi3-py310 builds against the stable ABI with a 3.10 floor (matches requires-python),
# so one wheel per platform covers every supported CPython.
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }

[features]
# extension-module keeps pyo3 from linking libpython, which is required for an importable
# extension -- so it is on by default and maturin builds the wheel with it. But a `cargo
# test` binary must link a real libpython to resolve the Py* symbols, so the test job turns
# it off with --no-default-features (macOS papers over the mismatch with dynamic lookup;
# Linux does not, and fails to link).
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
