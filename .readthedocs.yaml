# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# RTD does not run pixi natively, so it installs the *same* dependency list through pip:
# the `docs` extra in pyproject.toml is simultaneously the pixi `docs` feature (pixi
# exposes every optional-dependency group as a feature of the same name), so only
# resolution differs between this build and CI's -- pip against PyPI here, conda-forge
# from pixi.lock there -- never the list itself.
#
# If an RTD build ever fails where CI's lock-frozen build passes, and the cause traces to
# pip/conda version skew, the pre-made decision is to switch to `build.commands`:
# curl-install pixi, run `pixi run -e docs docs`, copy docs/_build/html to
# $READTHEDOCS_OUTPUT/html. That trades away RTD's managed build and its PR previews, so
# it is the fallback, not the default. Until then, pip.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # RTD clones shallow, which hides the tags versioneer derives the version from.
      # `|| true` because the fetch errors on the clones that aren't shallow, and an
      # unknown version is a cosmetic problem, not a reason to fail a docs build.
      - git fetch --unshallow || true

sphinx:
  configuration: docs/conf.py
  # The same bar CI holds: warnings are errors. Keep this in step with the `-W` in the
  # `docs` pixi task, or the two builds stop agreeing about what is green.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
